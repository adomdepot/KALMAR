<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบันทึกชั่วโมงขับ (Pro)</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="https://img5.pic.in.th/file/secure-sv1/logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'TH Sarabun New';
            src: local('TH Sarabun New');
        }
        body {
            font-family: 'TH Sarabun New', 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        /* อนิเมชั่นสำหรับ Modal */
        .modal-enter { opacity: 0; transform: scale(0.9); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .modal-enter-active { opacity: 1; transform: scale(1); }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden h-screen w-full flex flex-col text-slate-800">

    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white transition-opacity duration-500">
        <img src="https://img5.pic.in.th/file/secure-sv1/logo.png" class="h-20 mb-6 rounded-lg shadow-sm" alt="Logo">
        <div class="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
        <div class="mt-4 text-2xl font-bold text-blue-600 tracking-wide" id="loading-text">กำลังโหลดข้อมูล 0%</div>
    </div>

    <div class="flex-1 w-full relative z-0">
        <iframe 
            id="app-frame"
            src="https://script.google.com/macros/s/AKfycbwwPYu0dJuQ099jEaUiKp_NU-JJnpoKedF29VNX2OA99dRX1cXE_5E4N7Cn4Bp-AvF0Cw/exec" 
            class="absolute inset-0 w-full h-full border-none"
            onload="completeLoading()">
        </iframe>
    </div>

    <button id="install-btn" style="display: none;" class="fixed bottom-6 right-6 z-40 bg-slate-800 hover:bg-slate-900 text-white shadow-xl rounded-full px-5 py-3 flex items-center gap-2 transition-transform hover:scale-105 active:scale-95 border border-slate-700">
        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        <span class="text-lg font-bold tracking-wide">ติดตั้งแอป</span>
    </button>

    <div id="install-guide-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 modal-enter text-center">
            <img src="https://img5.pic.in.th/file/secure-sv1/logo.png" class="h-16 mx-auto mb-4 rounded-lg shadow-sm" alt="Logo">
            <h3 class="text-2xl font-bold text-slate-800 mb-2" id="guide-title">ติดตั้งระบบชั่วโมงขับ</h3>
            <p class="text-lg text-slate-500 mb-6" id="guide-desc">เพิ่มแอปนี้ลงในหน้าจอโฮมเพื่อการเข้าถึงที่รวดเร็ว</p>
            
            <div id="guide-steps" class="bg-slate-50 rounded-xl p-4 border border-slate-200 text-left mb-6 space-y-4">
                </div>

            <button onclick="closeInstallGuide()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xl py-3 rounded-xl transition-colors shadow-md">
                เข้าใจแล้ว
            </button>
        </div>
    </div>

    <script>
        // --- ระบบ Loading ---
        let percent = 0;
        const loadingText = document.getElementById('loading-text');
        const loader = document.getElementById('loader');

        const progress = setInterval(() => {
            if (percent < 90) {
                percent += Math.floor(Math.random() * 15) + 1;
                if (percent > 90) percent = 90;
                loadingText.innerText = `กำลังโหลดข้อมูล ${percent}%`;
            }
        }, 150);

        function completeLoading() {
            clearInterval(progress);
            loadingText.innerText = `กำลังโหลดข้อมูล 100%`;
            setTimeout(() => {
                loader.classList.add('opacity-0');
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 300);
        }

        // --- ระบบ PWA ติดตั้งแอป ---
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        const installGuideModal = document.getElementById('install-guide-modal');
        const modalContent = document.getElementById('modal-content');
        const guideSteps = document.getElementById('guide-steps');

        // ตรวจสอบ OS / Browser
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(userAgent);
        
        // เช็คว่าเคยติดตั้งไปแล้วหรือไม่ (ดูจากการรันแบบ Standalone)
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        // 1. ลงทะเบียน Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Reg Error:', err));
        }

        // 2. แสดงปุ่มติดตั้งเสมอถ้าเปิดบนมือถือ และยังไม่ได้ติดตั้ง
        if (isMobile && !isStandalone) {
            installBtn.style.display = 'flex';
        }

        // 3. ดักจับ Event Chrome Android (เพื่อรองรับการกดติดตั้งแบบ Native)
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        // 4. จัดการเมื่อกดปุ่มติดตั้ง
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // สำหรับ Chrome / Edge บน Android (แสดง Popup ของระบบได้เลย)
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            } else {
                // สำหรับ iOS Safari หรือเบราว์เซอร์อื่นๆ ที่ไม่รองรับ Prompt
                showManualInstallGuide();
            }
        });

        // ซ่อนปุ่มถ้าแอปถูกติดตั้งสำเร็จ
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });

        // --- ฟังก์ชันแสดงคู่มือติดตั้งแบบแมนนวล ---
        function showManualInstallGuide() {
            installGuideModal.classList.remove('hidden');
            installGuideModal.classList.add('flex');
            
            // รอให้ display:flex ทำงานเสร็จก่อนใส่คลาส animation
            requestAnimationFrame(() => {
                modalContent.classList.add('modal-enter-active');
            });

            if (isIOS) {
                // UI แนะนำสำหรับ iOS Safari
                guideSteps.innerHTML = `
                    <div class="flex items-center gap-3 text-lg text-slate-700">
                        <span class="bg-blue-100 text-blue-600 font-bold w-8 h-8 rounded-full flex items-center justify-center shrink-0">1</span>
                        <span>แตะไอคอน <svg class="w-6 h-6 inline text-blue-500 mx-1 border rounded p-0.5 shadow-sm bg-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg> <b>แชร์</b> ด้านล่างจอ</span>
                    </div>
                    <div class="flex items-center gap-3 text-lg text-slate-700">
                        <span class="bg-blue-100 text-blue-600 font-bold w-8 h-8 rounded-full flex items-center justify-center shrink-0">2</span>
                        <span>เลื่อนลงแล้วเลือก <br><span class="inline-flex items-center gap-1 font-bold mt-1 bg-white border px-2 py-1 rounded shadow-sm"><svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> เพิ่มไปยังหน้าจอโฮม</span></span>
                    </div>
                `;
            } else {
                // UI แนะนำสำหรับ Android (เบราว์เซอร์อื่นนอกจาก Chrome)
                guideSteps.innerHTML = `
                    <div class="flex items-center gap-3 text-lg text-slate-700">
                        <span class="bg-blue-100 text-blue-600 font-bold w-8 h-8 rounded-full flex items-center justify-center shrink-0">1</span>
                        <span>แตะไอคอน <svg class="w-6 h-6 inline text-slate-700 mx-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg> มุมขวาบน</span>
                    </div>
                    <div class="flex items-center gap-3 text-lg text-slate-700">
                        <span class="bg-blue-100 text-blue-600 font-bold w-8 h-8 rounded-full flex items-center justify-center shrink-0">2</span>
                        <span>เลือก <span class="inline-flex items-center gap-1 font-bold bg-white border px-2 py-1 rounded shadow-sm mx-1"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg> เพิ่มลงในหน้าจอหลัก</span></span>
                    </div>
                `;
            }
        }

        function closeInstallGuide() {
            modalContent.classList.remove('modal-enter-active');
            setTimeout(() => {
                installGuideModal.classList.add('hidden');
                installGuideModal.classList.remove('flex');
            }, 300);
        }
    </script>
</body>
</html>
